[package]
name = "coconutclaw"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "coconutclaw"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
ctrlc.workspace = true
fs2.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
coconutclaw-config = { path = "../coconutclaw-config" }
coconutclaw-provider = { path = "../coconutclaw-provider" }
notify = { version = "8.2.0", features = ["macos_kqueue"] }
tempfile = "3.27.0"
libc.workspace = true
blake3 = "=1.8.7"
coconutclaw-sync = { path = "../coconutclaw-sync" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-docs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }
