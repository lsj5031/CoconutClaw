[package]
name = "coconutclaw-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
local-executor = [
    "dep:anyhow", "dep:coconutclaw-config", "dep:coconutclaw-provider", "dep:ed25519-dalek",
    "dep:fs2", "dep:hex", "dep:libc", "dep:rand", "dep:reqwest", "dep:rusqlite",
]

[[bin]]
name = "gateway-local-executor"
path = "src/executor/main.rs"
required-features = ["local-executor"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
anyhow = { workspace = true, optional = true }
coconutclaw-provider = { path = "../coconutclaw-provider", optional = true }
ed25519-dalek = { version = "=3.0.0", optional = true }
fs2 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.9", optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
coconutclaw-config = { path = "../coconutclaw-config", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
coconutclaw-telegram = { path = "../coconutclaw-telegram" }
futures-util = "0.3"
hex = "0.4"
js-sys = "0.3"
subtle = "2"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
worker = "=0.9.0"
