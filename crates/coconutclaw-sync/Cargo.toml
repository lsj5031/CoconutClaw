[package]
name = "coconutclaw-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
blake3 = "=1.8.7"
fs2.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-docs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "test-utils"] }
tempfile = "3.27.0"
